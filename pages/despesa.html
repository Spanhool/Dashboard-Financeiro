<section id="cabecalho">
  <div id="titulo-cabecalho">
    <button id="btn-voltar">
      <i class="fa-solid fa-arrow-left-long"></i>
    </button>
    <h1>Nova despesa</h1>
  </div>
  <p id="subtitulo-cabecalho">Registre uma nova saída de dinheiro</p>
</section>

<section id="card-nova-receita-despesa">
  <div id="form-receita-despesa">
    <form action="" id="form-despesa">
      <label for="valor">Valor</label>
      <input type="text" id="valor" placeholder="R$ 0,00" required />

      <label for="data">Data</label>
      <input type="date" id="data" lang="pt-BR" required />

      <label for="descricao">Descrição</label>
      <input
        type="text"
        id="descricao"
        placeholder="Ex: Supermercado"
        required
      />

      <div id="btn-form">
        <button id="btn-cancelar">Cancelar</button>
        <button id="btn-salvar-despesa" type="submit">Salvar</button>
      </div>
    </form>
  </div>
</section>
