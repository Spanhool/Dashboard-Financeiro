<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Financeiro</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <link rel="stylesheet" href="src/style/style.css" />
  </head>
  <body>
    <nav id="sidebar">
      <div id="sidebar_content">
        <div id="user">
          <img src="src/img/logo.png" alt="foto" id="user_avatar" />
        </div>

        <ul id="side-items">
          <li class="side-item active">
            <a href="index.html">
              <i class="fa-solid fa-chart-line"></i>
            </a>
          </li>

          <li class="side-item">
            <a href="receita.html">
              <i class="fa-solid fa-money-check-dollar"></i>
            </a>
          </li>

          <li class="side-item">
            <a href="despesa.html">
              <i class="fa-solid fa-arrow-trend-down"></i>
            </a>
          </li>

          <li class="side-item">
            <a href="movimentacao.html">
              <i class="fa-solid fa-money-bill-transfer" id="open_btn_icon"></i>
            </a>
          </li>
        </ul>
      </div>

      <div id="logout">
        <button id="logout_btn">
          <i class="fa-solid fa-right-from-bracket"></i>
        </button>
      </div>
    </nav>

    <main>
      <section id="cabecalho">
        <h1>Olá Luiz, como vai?</h1>
        <p>Organize melhor as suas finanças aqui</p>
      </section>

      <section id="card-saldo">
        <div id="card">
          <div id="cabecalho-card-saldo">
            <i class="fa-regular fa-credit-card"></i>
            <h1>Saldo</h1>
          </div>

          <div id="info-card-saldo">
            <h3 id="valor-saldo"></h3>
          </div>
        </div>
      </section>

      <section id="cards-resumo">
        <div id="card-receita" class="card-resumo">
          <a href="movimentacao.html?filtro=receita" class="btn-maximizar-card">
            <img src="src/icons/expandir.svg" alt="" />
          </a>

          <div id="cabecalho-card-receita">
            <i class="fa-solid fa-money-check-dollar"></i>
            <h1>Entrada</h1>
          </div>

          <div id="info-card-receita">
            <h3 id="valor-receita">R$ 5.000,00</h3>
          </div>
        </div>

        <div id="card-despesa" class="card-resumo">
          <a href="movimentacao.html?filtro=despesa" class="btn-maximizar-card">
            <img src="src/icons/expandir.svg" alt="" />
          </a>

          <div id="cabecalho-card-despesa">
            <i class="fa-solid fa-arrow-trend-down"></i>
            <h1>Saida</h1>
          </div>

          <div id="info-card-despesa">
            <h3 id="valor-despesa">R$ 300,00</h3>
          </div>
        </div>
      </section>

      <section id="movimentacao">
        <div id="card-movimentacao">
          <div id="cabecalho-movimentacao">
            <a href="movimentacao.html">
              <img src="src/icons/expandir.svg" alt="" />
            </a>
          </div>

          <div id="movimentacao-lista"></div>
        </div>
      </section>
    </main>

    <script src="src/js/dashboard.js"></script>
  </body>
</html>
