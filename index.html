<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Financeiro</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <link rel="stylesheet" href="src/style/style.css" />
  </head>
  <body>
    <nav id="sidebar">
      <div id="sidebar_content">
        <div id="user">
          <img src="src/img/logo.png" alt="foto" id="user_avatar" />
          <p id="user_info">Lume</p>
        </div>

        <ul id="side-items">
          <li class="side-item active">
            <a href="#">
              <i class="fa-solid fa-chart-line"></i>
              <span class="item-description">Dashboard</span>
            </a>
          </li>

          <li class="side-item">
            <a href="#">
              <i class="fa-solid fa-money-check-dollar"></i>
              <span class="item-description">Nova Receita</span>
            </a>
          </li>

          <li class="side-item">
            <a href="#">
              <i class="fa-solid fa-arrow-trend-down"></i>
              <span class="item-description">Nova Despesa</span>
            </a>
          </li>

          <li class="side-item">
            <a href="#">
              <i class="fa-solid fa-money-bill-transfer" id="open_btn_icon"></i>
              <span class="item-description">Movimentação</span>
            </a>
          </li>
        </ul>
      </div>

      <div id="logout">
        <button id="logout_btn">
          <i class="fa-solid fa-right-from-bracket"></i>
          <span class="item-description"> Logout </span>
        </button>
      </div>
    </nav>

    <main><h1>Dashboard</h1></main>
  </body>
</html>
